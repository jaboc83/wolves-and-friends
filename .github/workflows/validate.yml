name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm run build

      - name: Run application checks
        shell: bash
        run: |
          set -euo pipefail
          for test_dir in scripts/tests/*/; do
            for test_file in "${test_dir}"test-*.mjs; do
              [[ -e "${test_file}" ]] || continue
              echo "::group::${test_file}"
              node "${test_file}"
              echo "::endgroup::"
            done
          done

      - name: Compare client assets with PR base
        if: github.event_name == 'pull_request'
        env:
          ASSET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/build/compare-client-assets.mjs "$ASSET_BASE_SHA"
